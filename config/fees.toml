# A small, illustrative excerpt in the shape of the German fee schedule for doctors (GOÄ): points per number, the
# section that sets the threshold and maximum factor, and pairs that may not be billed in the same session.
# Check every value against the official schedule before any real use.
point_value_eur = 0.0582873
tariff_max_factor = 5.0
excluded_pairs = [["1", "3"], ["5", "7"], ["5", "8"], ["7", "8"]]  # may not be billed in the same session        # the tariff reimburses up to this factor when a fee agreement is attached

[sections.personal]
threshold = 2.3
maximum = 3.5
[sections.technical]
threshold = 1.8
maximum = 2.5
[sections.lab]
threshold = 1.15
maximum = 1.3

